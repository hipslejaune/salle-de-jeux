<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a90e8">
<title>Descente du ruisseau</title>
<style>
  html,body{margin:0;height:100%;color-scheme:dark;background:#4a90e8;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
  #vue{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #chargement{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#4a90e8;transition:opacity .6s;text-shadow:0 1px 6px #0006}
  #chargement.fini{opacity:0;pointer-events:none}
  #couche{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #couche>*{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform}
  .bouton{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));border:1.5px solid rgba(255,255,255,.8);background:rgba(10,30,60,.35);color:#fff;font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
  #gyro{display:none;top:max(56px,calc(env(safe-area-inset-top) + 44px))}
  #aide{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:15px;letter-spacing:.02em;text-shadow:0 1px 6px #000a;pointer-events:none;transition:opacity .8s;opacity:.95}
  #aide.cache{opacity:0}
  #piste{position:fixed;left:18px;right:18px;bottom:calc(8px + env(safe-area-inset-bottom));height:3px;border-radius:2px;background:#ffffff44;pointer-events:none}
  #piste i{position:absolute;left:0;top:0;height:100%;width:0;border-radius:2px;background:#fff}
</style>
</head>
<body>
<canvas id="vue" tabindex="0" aria-label="Descente d'un ruisseau en radeau : fais défiler pour avancer, glisse de côté pour tourner autour du radeau"></canvas>
<div id="couche"></div>
<button id="son" class="bouton" type="button" aria-pressed="false">Chants d’oiseaux : non</button>
<div id="aide">Fais défiler pour avancer · glisse de côté pour tourner autour du radeau</div>
<div id="piste"><i></i></div>
<div id="chargement" role="status">Mise à l’eau du bateau…</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* Descente du ruisseau en radeau — scène 3D temps réel (three.js).

   qui est ensuite tourné pour three.js. API pour poser des éléments HTML dans le décor (jeux, mascotte…) :

const LOW = matchMedia('(pointer: coarse)').matches;

const cv = document.getElementById('vue');

const scene = new THREE.Scene();
const FOG = new THREE.Color(0.66, 0.82, 1.0);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 700);
const monde = new THREE.Group(); monde.rotation.x = -Math.PI / 2; scene.add(monde);   // (x,y,z) monde -> (x, z, -y) three

// ───────────── outils ─────────────
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  return h;

function col(hex) { return new THREE.Color(hex); }

// parcours du bateau : léger lacet autour de l'axe du ruisseau

// ───────────── ciel ─────────────

    wrap3(w, h, (ox, oy) => { x.beginPath(); x.moveTo(px + ox, py + oy); x.lineTo(px + ox + Math.cos(a) * L, py + oy + Math.sin(a) * L); x.stroke(); }); } x.globalAlpha = 1; });

const texTuft = cTex(128, 128, (x, w, h) => { for (let i = 0; i < 24; i++) { const x0 = rr(14, 114), hh = rr(60, 124), bend = rr(-30, 30), wd = rr(3, 5.5);
  const g = x.createLinearGradient(0, h, 0, h - hh); g.addColorStop(0, '#2a5512'); g.addColorStop(.5, Math.random() < .3 ? '#6f9a2c' : '#5a9a26'); g.addColorStop(1, Math.random() < .35 ? '#d3dd6b' : '#a6d24c'); x.fillStyle = g;
  x.beginPath(); x.moveTo(x0 - wd, h); x.quadraticCurveTo(x0 + bend * .3, h - hh * .55, x0 + bend, h - hh); x.quadraticCurveTo(x0 + bend * .3 + wd * .4, h - hh * .5, x0 + wd, h); x.fill(); } }, false);
const texFeuilles = (pal, n, smin, smax, rond) => cTex(256, 256, (x, w, h) => { for (let i = 0; i < n; i++) { const px = rr(14, 242), py = rr(14, 242), a = rr(smin, smax), b = a * (rond ? rr(.7, .95) : rr(.5, .7)), rot = rr(0, 6.3), c = pal[(Math.random() * pal.length) | 0];
  x.save(); x.translate(px, py); x.rotate(rot); const g = x.createLinearGradient(-a, 0, a, 0); g.addColorStop(0, c); g.addColorStop(1, pal[(Math.random() * pal.length) | 0]); x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, a, b, 0, 0, 6.3); x.fill();
  x.strokeStyle = 'rgba(20,50,10,.45)'; x.lineWidth = 1; x.beginPath(); x.moveTo(-a, 0); x.lineTo(a, 0); x.stroke(); x.restore(); } }, false);
const texChene = texFeuilles(['#2f6a16', '#3f8a1c', '#58a52a', '#79bf3a', '#2a5a14', '#92cc4a'], 62, 18, 30, false);
const texBouleau = texFeuilles(['#4f8f26', '#6fb22c', '#8fcf3f', '#a5d84e', '#3f7c20'], 96, 11, 18, true);
const texAiguilles = cTex(256, 256, (x, w, h) => { for (let i = 0; i < 34; i++) { const px = rr(30, 226), py = rr(30, 226), ang = rr(0, 6.3); x.save(); x.translate(px, py); x.rotate(ang);
  for (let k = 0; k < 18; k++) { const a = -1.4 + k / 17 * 2.8 + rr(-.1, .1), L = rr(20, 34); x.strokeStyle = ['#0f3a1c', '#1c5a2a', '#2c7a38', '#164a22'][(Math.random() * 4) | 0]; x.lineWidth = rr(1.4, 2.2); x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a) * L, Math.sin(a) * L); x.stroke(); } x.restore(); } }, false);
const texFougere = cTex(128, 256, (x, w, h) => { x.strokeStyle = '#2b6118'; x.lineWidth = 3; x.beginPath(); x.moveTo(64, 254); x.quadraticCurveTo(70, 130, 62, 6); x.stroke();
  for (let k = 0; k < 24; k++) { const t = k / 24, y = 246 - t * 236, cx = 64 + Math.sin(t * 2.4) * 5, L = Math.pow(1 - t, .75) * 54 + 6; for (const s of [-1, 1]) { x.fillStyle = ['#3c8a24', '#4e9c2c', '#68b43a'][(Math.random() * 3) | 0]; x.beginPath(); x.moveTo(cx, y);
    x.quadraticCurveTo(cx + s * L * .5, y - 10 - L * .12, cx + s * L, y - 16 - L * .2); x.quadraticCurveTo(cx + s * L * .55, y - 2, cx, y + 3); x.fill(); } } }, false);

  chene: cTex(128, 256, (x, w, h) => { x.fillStyle = '#5f4f3e'; x.fillRect(0, 0, w, h); for (let i = 0; i < 46; i++) { const x0 = rr(0, w); x.strokeStyle = `rgba(${28 + Math.random() * 20},${22 + Math.random() * 14},16,${rr(.4, .75)})`; x.lineWidth = rr(2, 5);
    wrap3(w, h, (ox, oy) => { x.beginPath(); x.moveTo(x0 + ox, oy); x.bezierCurveTo(x0 + rr(-14, 14) + ox, h * .33 + oy, x0 + rr(-14, 14) + ox, h * .66 + oy, x0 + rr(-8, 8) + ox, h + oy); x.stroke(); }); }
    for (let i = 0; i < 34; i++) { const x0 = rr(0, w); x.strokeStyle = `rgba(150,130,104,${rr(.15, .35)})`; x.lineWidth = rr(1.5, 3); x.beginPath(); x.moveTo(x0, 0); x.bezierCurveTo(x0 + rr(-10, 10), h * .3, x0 + rr(-10, 10), h * .7, x0, h); x.stroke(); }
    const g = x.createLinearGradient(0, h, 0, h * .6); g.addColorStop(0, 'rgba(70,100,40,.55)'); g.addColorStop(1, 'rgba(70,100,40,0)'); x.fillStyle = g; x.fillRect(0, h * .6, w, h * .4); }),
  bouleau: cTex(128, 256, (x, w, h) => { x.fillStyle = '#ebe8de'; x.fillRect(0, 0, w, h); for (let i = 0; i < 30; i++) { x.fillStyle = `rgba(${150 + Math.random() * 40},${148 + Math.random() * 40},${140 + Math.random() * 30},.25)`; x.fillRect(rr(0, w), rr(0, h), rr(10, 40), rr(8, 30)); }
    for (let i = 0; i < 40; i++) { const px = rr(0, w), py = rr(0, h), L = rr(14, 60), th = rr(3, 8); x.fillStyle = `rgba(${28 + Math.random() * 20},${28 + Math.random() * 20},26,${rr(.7, .95)})`; wrap3(w, h, (ox, oy) => { x.beginPath(); x.ellipse(px + ox, py + oy, L / 2, th / 2, 0, 0, 6.3); x.fill(); }); } }),
  pin: cTex(128, 256, (x, w, h) => { x.fillStyle = '#8c5b3b'; x.fillRect(0, 0, w, h); for (let i = 0; i < 90; i++) { const px = rr(0, w), py = rr(0, h); x.strokeStyle = `rgba(${60 + Math.random() * 30},${34 + Math.random() * 18},20,${rr(.4, .8)})`; x.lineWidth = rr(1.5, 3.5);
    wrap3(w, h, (ox, oy) => { x.beginPath(); x.moveTo(px + ox, py + oy); x.lineTo(px + rr(-18, 18) + ox, py + rr(10, 34) + oy); x.stroke(); }); } for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(190,120,80,${rr(.12, .3)})`; x.fillRect(rr(0, w), rr(0, h), rr(8, 28), rr(10, 30)); } })

// ───────────── terrain ─────────────
const US = []; { const P = []; for (let u = 0; u < 4; u += 0.2) P.push(u); for (let u = 4; u < 12; u += 0.5) P.push(u); for (let u = 12; u < 30; u += 1.5) P.push(u); for (let u = 30; u <= 75.1; u += 4) P.push(u);
