<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4a90e8">
<title>Descente du ruisseau</title>
<style>

  #vue{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #chargement{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#4a90e8;transition:opacity .6s;text-shadow:0 1px 6px #0006}
  #chargement.fini{opacity:0;pointer-events:none}
  #couche{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #couche>*{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform}

  #aide{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:15px;letter-spacing:.02em;text-shadow:0 1px 6px #000a;pointer-events:none;transition:opacity .8s;opacity:.95}
  #aide.cache{opacity:0}
  #piste{position:fixed;left:18px;right:18px;bottom:calc(8px + env(safe-area-inset-bottom));height:3px;border-radius:2px;background:#ffffff44;pointer-events:none}
  #piste i{position:absolute;left:0;top:0;height:100%;width:0;border-radius:2px;background:#fff}
</style>
</head>
<body>
<canvas id="vue" tabindex="0" aria-label="Descente d'un ruisseau en radeau : fais défiler pour avancer, glisse de côté pour tourner autour du radeau"></canvas>
<div id="couche"></div>
<button id="son" class="bouton" type="button" aria-pressed="false">Chants d’oiseaux : non</button>

<div id="chargement" role="status">Mise à l’eau du bateau…</div>

<style>#plumeRig #ombre{display:none}</style>

<script type="module">
